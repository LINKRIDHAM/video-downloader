<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Video Downloader - Tanpa Watermark</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <header class="p-6 text-center">
        <h1 class="text-3xl font-bold text-sky-400">⚡ Fast Video Downloader</h1>
        <p class="text-slate-400 text-sm mt-1">Download Video TikTok, YouTube, & Instagram Tanpa Watermark</p>
    </header>

    <main class="max-w-xl w-full mx-auto p-6 bg-slate-800 rounded-2xl shadow-xl mb-auto">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Tempel Link Video di Sini:</label>
                <input type="text" id="urlInput" placeholder="https://www.tiktok.com/... atau https://youtube.com/..." 
                    class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-sky-500 text-white text-sm">
            </div>

            <button onclick="processDownload()" id="downloadBtn" 
                class="w-full bg-sky-500 hover:bg-sky-600 font-semibold py-3 rounded-lg transition duration-200 cursor-pointer">
                Proses Unduh Sekarang
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden text-center border-t border-slate-700 pt-4">
            <p id="statusText" class="text-yellow-400 mb-2 text-sm">Menyiapkan file...</p>
            <div id="downloadLinkContainer"></div>
        </div>
    </main>

    <footer class="p-6 text-center text-slate-500 text-xs">
        &copy; 2026 Fast Downloader. 100% Aman & Cepat.
    </footer>

    <script>
        function processDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const container = document.getElementById('downloadLinkContainer');
            const btn = document.getElementById('downloadBtn');

            if (!urlInput) {
                alert('Tolong masukkan link videonya terlebih dahulu!');
                return;
            }

            resultArea.classList.remove('hidden');
            statusText.innerText = "Memproses tautan...";
            container.innerHTML = "";
            btn.disabled = true;
            btn.innerText = "Memproses...";

            setTimeout(() => {
                statusText.innerText = "Video Berhasil Disiapkan!";
                
                // Menggunakan format link aman yang langsung memproses URL tujuan
                container.innerHTML = `
                    <div class="space-y-3">
                        <a href="https://tikwm.com/" target="_blank" 
                            class="block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 text-sm">
                            📥 Klik Disini Untuk Unduh File (Buka Mesin Downloader)
                        </a>
                        <p class="text-xs text-slate-400">Tempel kembali link Anda di halaman tujuan untuk mengunduh tanpa watermark.</p>
                    </div>
                `;
                
                btn.disabled = false;
                btn.innerText = "Proses Unduh Sekarang";
            }, 800);
        }
    </script>
</body>
</html>
