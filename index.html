<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Video Downloader - Tanpa Watermark</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <header class="p-6 text-center">
        <h1 class="text-3xl font-bold text-sky-400">⚡ Fast Video Downloader</h1>
        <p class="text-slate-400 text-sm mt-1">Download Video TikTok, YouTube, & Instagram</p>
    </header>

    <main class="max-w-xl w-full mx-auto p-6 bg-slate-800 rounded-2xl shadow-xl mb-auto">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Tempel Link Video di Sini:</label>
                <input type="text" id="urlInput" placeholder="https://tiktok.com/..." 
                    class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-sky-500 text-white text-sm">
            </div>

            <button onclick="startDownload()" id="downloadBtn" 
                class="w-full bg-sky-500 hover:bg-sky-600 font-semibold py-3 rounded-lg transition duration-200 cursor-pointer">
                Proses Unduh Sekarang
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden text-center border-t border-slate-700 pt-4">
            <p id="statusText" class="text-yellow-400 mb-2 text-sm">Sedang memproses...</p>
            <div id="downloadLinkContainer"></div>
        </div>
    </main>

    <footer class="p-6 text-center text-slate-500 text-xs">
        &copy; 2026 Fast Downloader.
    </footer>

    <script>
        function startDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const container = document.getElementById('downloadLinkContainer');
            const btn = document.getElementById('downloadBtn');

            if (!urlInput) {
                alert('Tolong masukkan link videonya terlebih dahulu!');
                return;
            }

            resultArea.classList.remove('hidden');
            statusText.innerText = "Menyiapkan link unduhan...";
            container.innerHTML = "";
            btn.disabled = true;
            btn.innerText = "Memproses...";

            // Menggunakan API alternatif (TikWM / Layanan Publik Serbaguna)
            // Contoh menggunakan endpoint GET publik
            const apiUrl = 'https://www.tikwm.com/api/?url=' + encodeURIComponent(urlInput);

            fetch(apiUrl)
            .then(response => response.json())
            .then(res => {
                if (res.code === 0 && res.data) {
                    statusText.innerText = "Video Berhasil Disiapkan!";
                    const downloadUrl = res.data.play || res.data.hdplay;

                    container.innerHTML = `
                        <a href="${downloadUrl}" target="_blank" 
                            class="inline-block bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-200 text-sm">
                            ⬇️ Klik Disini Untuk Unduh File
                        </a>
                    `;
                } else {
                    // Jika bukan TikTok atau API khusus gagal, arahkan ke layanan redirect aman
                    statusText.innerText = "Silakan unduh melalui tautan alternatif:";
                    container.innerHTML = `
                        <a href="https://tikwm.com/" target="_blank" 
                            class="inline-block bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded-lg text-sm mt-2">
                            Buka Mesin Downloader Utama
                        </a>
                    `;
                }
            })
            .catch(error => {
                statusText.innerText = "Gagal memproses.";
                container.innerHTML = `<p class='text-red-400 text-xs mt-1'>Coba gunakan link TikTok yang valid.</p>`;
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Proses Unduh Sekarang";
            });
        }
    </script>
</body>
</html>
