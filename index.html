<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Video Downloader - Tanpa Watermark</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <header class="p-6 text-center">
        <h1 class="text-3xl font-bold text-sky-400">⚡ Fast Video Downloader</h1>
    </header>

    <main class="max-w-xl w-full mx-auto p-6 bg-slate-800 rounded-2xl shadow-xl mb-auto">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Tempel Link Video di Sini:</label>
                <input type="text" id="urlInput" placeholder="https://tiktok.com/..." 
                    class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-sky-500 text-white text-sm">
            </div>

            <!-- Tombol Panggil Fungsi -->
            <button onclick="startDownload()" id="downloadBtn" 
                class="w-full bg-sky-500 hover:bg-sky-600 font-semibold py-3 rounded-lg transition duration-200 cursor-pointer">
                Proses Unduh Sekarang
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden text-center border-t border-slate-700 pt-4">
            <p id="statusText" class="text-yellow-400 mb-2 text-sm">Sedang memproses...</p>
            <div id="downloadLinkContainer"></div>
        </div>
    </main>

    <footer class="p-6 text-center text-slate-500 text-xs">
        &copy; 2026 Fast Downloader.
    </footer>

    <!-- Logika JavaScript yang Disederhanakan -->
    <script>
        function startDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const container = document.getElementById('downloadLinkContainer');
            const btn = document.getElementById('downloadBtn');

            // Validasi Input
            if (!urlInput) {
                alert('Tolong masukkan link videonya terlebih dahulu!');
                return;
            }

            // Tampilkan Loading
            resultArea.classList.remove('hidden');
            statusText.innerText = "Menghubungkan ke server...";
            container.innerHTML = "";
            btn.disabled = true;
            btn.innerText = "Memproses...";

            // Panggil API Publik (Tanpa async/await agar lebih aman di browser lama)
            const apiUrl = 'https://api.cobalt.tools/api/json';
            const requestBody = {
                url: urlInput,
                vQuality: "720"
            };

            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Gagal terhubung ke API (Status: ' + response.status + ')');
                }
                return response.json();
            })
            .then(data => {
                // Tangani Respon Berhasil
                if (data.status === 'redirect' || data.status === 'stream' || data.status === 'picker') {
                    statusText.innerText = "Video Berhasil Disiapkan!";
                    
                    // Ambil URL Download (sesuai format respon API cobalt)
                    let downloadUrl = data.url || (data.picker && data.picker[0] && data.picker[0].url);

                    if (downloadUrl) {
                         container.innerHTML = `
                            <a href="${downloadUrl}" target="_blank" 
                                class="inline-block bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-200 text-sm">
                                ⬇️ Klik Disini Untuk Unduh File
                            </a>
                         `;
                    } else {
                         statusText.innerText = "Maaf, URL video tidak ditemukan.";
                         container.innerHTML = `<p class='text-red-400 text-xs mt-1'>Format tidak didukung atau link salah.</p>`;
                    }

                } else {
                    // Tangani Respon Gagal
                    statusText.innerText = "Gagal memproses video.";
                    container.innerHTML = `<p class='text-red-400 text-xs mt-1'>Pastikan link valid (TikTok/YouTube).</p>`;
                }
            })
            .catch(error => {
                // Tangani Error Jaringan/CORS
                statusText.innerText = "Error Terjadi";
                container.innerHTML = `<p class='text-red-400 text-xs mt-1'>Cek konsol browser atau coba lagi nanti.</p>`;
                console.error('Error detail:', error);
            })
            .finally(() => {
                // Kembalikan Tombol
                btn.disabled = false;
                btn.innerText = "Proses Unduh Sekarang";
            });
        }
    </script>
</body>
</html>
